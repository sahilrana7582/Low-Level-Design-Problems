# ---------------------------------------------------------------------------
# postgresql.bench.conf
#
# Settings this benchmark REQUIRES. Append to
#   /opt/homebrew/var/postgresql@16/postgresql.conf
# then restart:
#   brew services restart postgresql@16
#
# Why each one is here matters as much as the value. A benchmark that silently
# runs on a config that cannot support the experiment produces a number that
# looks like a finding and is actually an artefact.
# ---------------------------------------------------------------------------

# --- REQUIRED: pool sweep goes to 256 --------------------------------------
# The methodology sweeps pool size {8,16,32,64,128,256} for BOTH paths. With
# max_connections=100 the 128 and 256 steps fail on "too many clients already"
# and we would be measuring the connection limit, not lock contention.
# 300 = 256 (max pool) + observability sampler + psql + slack.
max_connections = 300

# --- REQUIRED: per-statement attribution -----------------------------------
# pg_stat_statements is a shared_preload_libraries extension: CREATE EXTENSION
# alone is not enough, the library must be loaded at postmaster start. Without
# it, pg_stat_statements_reset() in 90_reset.sql and the top-10 by
# total_exec_time capture are both impossible.
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = all          # 'all' includes statements nested inside
                                        # plpgsql function bodies. 'top' would
                                        # only show "SELECT contest.join_contest(...)"
                                        # and hide the UPDATE we are actually
                                        # trying to attribute cost to.
pg_stat_statements.track_utility = off

# --- Buffer pool -----------------------------------------------------------
# Default 128MB. contest_inst_team at 1M rows plus its indexes exceeds that,
# so the tail of Experiment B would start measuring buffer eviction. 2GB on a
# 16GB machine leaves room for the OS page cache and the load generator.
shared_buffers = 2GB
effective_cache_size = 6GB

# --- WAL -------------------------------------------------------------------
# Default max_wal_size=1GB forces a requested checkpoint every few seconds at
# 5000 joins/sec. Checkpoint storms would show up as latency spikes that have
# nothing to do with row locks. Larger max_wal_size + a longer timeout pushes
# checkpoints outside the 60s measurement window; checkpoint counts are
# captured per run so we can prove none occurred mid-window.
max_wal_size = 8GB
min_wal_size = 2GB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
wal_compression = off                   # off: we want to measure fsync cost, not
                                        # CPU spent compressing WAL records.

# --- Observability ---------------------------------------------------------
track_activities = on
track_counts = on
track_io_timing = on                    # needed to separate IO wait from CPU
track_wal_io_timing = on                # PG14+. WALWrite / WALSync timing is the
                                        # headline "after" number for the sharded
                                        # path -- the shift from Lock/transactionid
                                        # to IO/WALSync.
track_functions = pl                    # per-function exec counts for the plpgsql
                                        # entry points

# --- Autovacuum ------------------------------------------------------------
# The shard table is 128 rows receiving ~1M updates. Left to global defaults
# (autovacuum_vacuum_scale_factor 0.2 of 128 rows = 25 tuples) autovacuum fires
# constantly; ignored entirely, the page free space that HOT depends on is
# never reclaimed and HOT pruning degrades mid-run. Per-table storage
# parameters in 02_sharded_schema.sql override this for contest_inst_shard;
# these globals just make autovacuum responsive enough to keep up.
autovacuum = on
autovacuum_naptime = 5s
autovacuum_max_workers = 4
autovacuum_vacuum_cost_delay = 0        # do not throttle; we want vacuum to keep
                                        # pace so that "HOT broke" in the results
                                        # means an index problem, not a starved
                                        # vacuum.

# --- Logging ---------------------------------------------------------------
log_min_duration_statement = -1         # OFF. Logging every slow statement at
                                        # 5000 req/s makes the logger the
                                        # bottleneck and the log write shows up
                                        # as latency in the measurement.
log_checkpoints = on
log_autovacuum_min_duration = 0
log_lock_waits = on
deadlock_timeout = 1s                   # log_lock_waits fires after this; keep it
                                        # high enough that normal row-lock queues
                                        # on the baseline are not all logged.

# --- Left at default ON PURPOSE --------------------------------------------
# synchronous_commit: swept per experiment {off, local, on} via ALTER SYSTEM /
#   per-session SET. Do NOT pin it here -- Methodology item 8 requires the full
#   matrix, because local NVMe fsync (~0.1-0.3ms) understates cloud EBS with a
#   sync replica (~2ms) and therefore understates the baseline's disadvantage.
# fsync: stays ON. Turning it off would make the baseline look artificially good
#   and invalidate the entire comparison.
